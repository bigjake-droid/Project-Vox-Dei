<!DOCTYPE html>
<html>

<head>

  <title>PROJECT-VOX-DEI</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- SPLASH SCREEN -->

  <div id="splashScreen" class="screen">

    <img src="icon-512.jpg"
         class="logo">

    <h1 class="mainTitle">
      PROJECT-VOX-DEI
    </h1>

  </div>

  <!-- INITIATE SCREEN -->

  <div id="initiateScreen"
       class="screen hidden">

    <div class="menuBox">

      <h1 class="initiateText">
        INITIATE
      </h1>

      <div class="card"
           onclick="enterApp('Individual')">

        <h2>Individual</h2>

      </div>

      <div class="card"
           onclick="enterApp('Corporation')">

        <h2>Corporation</h2>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
